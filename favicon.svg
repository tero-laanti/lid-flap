<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -33 50 50">
  <g stroke="#3a4150" stroke-width="2.2" stroke-linejoin="round">
    <!-- lid, hinged at the back of the base, opened ~70° -->
    <g transform="translate(-18 6) rotate(-70)">
      <rect x="0" y="-4" width="36" height="7" rx="2" fill="#d8dde6"/>
      <rect x="4" y="-3" width="28" height="3.4" fill="#2e6bd8" stroke="none"/>
    </g>
    <!-- base -->
    <rect x="-21" y="3" width="42" height="10" rx="3" fill="#c9ced8"/>
  </g>
  <circle cx="12" cy="8" r="3.4" fill="#fff"/>
  <circle cx="13" cy="8" r="1.8" fill="#111"/>
</svg>
